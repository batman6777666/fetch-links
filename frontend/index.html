<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --card: #0f0f0f;
            --border: #1a1a1a;
            --border-hover: #2a2a2a;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.15);
            --accent-glow-strong: rgba(139, 92, 246, 0.3);
            --green: #34d399;
            --green-glow: rgba(52, 211, 153, 0.15);
            --red: #f87171;
            --red-glow: rgba(248, 113, 113, 0.15);
            --amber: #fbbf24;
            --amber-glow: rgba(251, 191, 36, 0.12);
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --link: #a78bfa;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 4px 24px rgba(0,0,0,0.5), 0 12px 48px rgba(0,0,0,0.3);
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1rem 4rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(139, 92, 246, 0.08), transparent),
                radial-gradient(ellipse 50% 40% at 80% 100%, rgba(139, 92, 246, 0.04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 1;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            background: linear-gradient(135deg, #c4b5fd, #a78bfa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-top: 0.35rem;
        }

        /* ── MAIN CARD ── */
        .main-card {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        .input-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 0.9rem 1rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: vertical;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea::placeholder { color: var(--text-muted); }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.7rem 1.3rem;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            box-shadow: 0 2px 16px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.45);
        }

        .btn-primary:active:not(:disabled) { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            border-color: var(--border-hover);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        .fetching .spinner { display: inline-block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── STATUS BAR ── */
        .sb {
            margin-top: 1.25rem;
            display: none;
            flex-direction: column;
            gap: 0.4rem;
        }

        .sb.visible { display: flex; }

        .sb-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .prog-track {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ── RESULTS HEADER ── */
        .results-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.25rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        .results-title {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .btn-copy-all {
            font-size: 0.68rem;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            background: var(--accent-glow);
            color: var(--accent-light);
            border: 1px solid rgba(139, 92, 246, 0.2);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            transition: all var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-copy-all:hover:not(:disabled) {
            background: var(--accent-glow-strong);
        }

        .btn-copy-all:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ── RESULT BOX ── */
        .result-box {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 2px;
            scroll-behavior: smooth;
        }

        .result-box::-webkit-scrollbar { width: 4px; }
        .result-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── RESULT ROW ── */
        .ri {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 0.6rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 0.8rem;
            animation: slideIn 0.25s ease both;
            transition: border-color var(--transition);
        }

        .ri.done { border-color: rgba(52, 211, 153, 0.2); }
        .ri.failed { border-color: rgba(248, 113, 113, 0.18); }
        .ri.fetching, .ri.resolving { border-color: rgba(139, 92, 246, 0.2); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .ri-badge {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--accent-light);
            background: var(--accent-glow);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 5px;
            padding: 0.15rem 0.4rem;
            white-space: nowrap;
        }

        .ri-link-cell { min-width: 0; }

        .ri-link {
            color: var(--link);
            font-size: 0.75rem;
            text-decoration: none;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color var(--transition);
        }

        .ri-link:hover { color: #c4b5fd; text-decoration: underline; }

        .ri-err {
            font-size: 0.72rem;
            color: var(--red);
            opacity: 0.8;
            font-style: italic;
        }

        .ri-ph {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .ri-status {
            font-size: 0.62rem;
            font-weight: 700;
            white-space: nowrap;
            padding: 0.15rem 0.45rem;
            border-radius: 99px;
        }

        .ri-status.fetching, .ri-status.resolving {
            background: var(--accent-glow);
            color: var(--accent-light);
            animation: pulse 1.4s ease infinite;
        }

        .ri-status.done {
            background: var(--green-glow);
            color: var(--green);
        }

        .ri-status.failed {
            background: var(--red-glow);
            color: var(--red);
        }

        .ri-status.waiting {
            background: rgba(71, 85, 105, 0.1);
            color: var(--text-muted);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-copy-one {
            font-size: 0.62rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn-copy-one:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
        }

        .btn-copy-one.copied {
            color: var(--green);
            border-color: rgba(52, 211, 153, 0.3);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
        }

        #toast.show { transform: translateX(-50%) translateY(0); }

        /* ── FOOTER ── */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        footer a {
            color: var(--accent-light);
            text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            body { padding: 0 0.75rem 3rem; }

            header { padding: 2rem 0.5rem 1.5rem; }

            .main-card {
                padding: 1.25rem;
                border-radius: var(--radius-lg);
            }

            textarea { height: 120px; font-size: 0.82rem; }

            .btn-row { gap: 0.5rem; }

            .btn { padding: 0.65rem 1rem; font-size: 0.78rem; }

            .ri {
                grid-template-columns: auto 1fr;
                grid-template-rows: auto auto;
                gap: 0.4rem 0.5rem;
            }

            .ri-status {
                grid-column: 1;
                grid-row: 2;
            }

            .btn-copy-one {
                grid-column: 2;
                grid-row: 2;
                justify-self: end;
            }

            .ri-link-cell {
                grid-column: 2;
                grid-row: 1;
            }

            .results-hdr { flex-direction: column; align-items: flex-start; }
        }

        @media (max-width: 380px) {
            .main-card { padding: 1rem; }

            .logo-icon { width: 36px; height: 36px; font-size: 1.1rem; }

            h1 { font-size: 1.4rem; }

            .btn { width: 100%; }

            .btn-row { flex-direction: column; }
        }

        @media (min-width: 1024px) {
            .main-card { padding: 2.25rem; }
            textarea { height: 160px; }
        }

        /* ── REDUCED MOTION ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo-row">
            <div class="logo-icon">🔗</div>
            <h1>Fetch Links</h1>
        </div>
        <p class="subtitle">Extract direct download links automatically</p>
    </header>

    <!-- MAIN CARD -->
    <div class="main-card">
        <div class="input-label">FXLinks URLs (1–10)</div>
        <textarea id="urlInput" placeholder="Paste FXLinks URLs here, one per line"
            spellcheck="false" autocomplete="off"></textarea>
        <div class="btn-row">
            <button id="fetchBtn" class="btn btn-primary" onclick="startFetching()">
                <span class="spinner" id="fetchSpinner"></span>
                <span id="fetchBtnText">Start Fetching</span>
            </button>
            <button class="btn btn-secondary" onclick="clearFetch()">Clear</button>
        </div>

        <!-- Status -->
        <div class="sb" id="fetchSB">
            <div class="sb-text" id="fetchStatus">Ready</div>
            <div class="prog-track">
                <div class="prog-fill" id="fetchProg"></div>
            </div>
        </div>

        <!-- Results -->
        <div id="fetchResultsWrap" style="display:none;">
            <div class="results-hdr">
                <span class="results-title" id="fetchResultsTitle">Results</span>
                <button class="btn-copy-all" id="fetchCopyAll" onclick="copyAll()" disabled>Copy All</button>
            </div>
            <div class="result-box" id="fetchBox">
                <div class="empty-state">Waiting for results…</div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- FOOTER -->
    <footer>
        Built with ♥ &middot; <a href="https://fetch-links.pages.dev" target="_blank" rel="noopener">fetch-links.pages.dev</a>
    </footer>

    <script>
        const API_BASE = "https://fetch-links.containers.snapdeploy.app";

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function copyOne(link, btn) {
            navigator.clipboard.writeText(link).then(() => {
                btn.textContent = 'Copied'; btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600);
            }).catch(() => showToast('Copy failed'));
        }

        function statusLabel(s) {
            if (s === 'fetching' || s === 'resolving') return 'Processing';
            if (s === 'done') return 'Done';
            if (s === 'failed') return 'Failed';
            if (s === 'waiting') return 'Queued';
            return s;
        }

        function buildRow(badgeText, status, link, errMsg) {
            const row = document.createElement('div');
            row.className = 'ri ' + status;

            const badge = document.createElement('span');
            badge.className = 'ri-badge'; badge.textContent = badgeText;

            const cell = document.createElement('div');
            cell.className = 'ri-link-cell';

            const st = document.createElement('span');
            st.className = 'ri-status ' + status; st.textContent = statusLabel(status);

            const cpBtn = document.createElement('button');
            cpBtn.className = 'btn-copy-one'; cpBtn.textContent = 'Copy';
            cpBtn.style.display = 'none';

            if (link) {
                const a = document.createElement('a');
                a.className = 'ri-link'; a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
                a.textContent = link; cell.appendChild(a);
                cpBtn.style.display = ''; cpBtn.onclick = () => copyOne(link, cpBtn);
            } else if (errMsg) {
                const e = document.createElement('span'); e.className = 'ri-err'; e.textContent = errMsg; cell.appendChild(e);
            } else {
                const p = document.createElement('span'); p.className = 'ri-ph';
                p.textContent = (status === 'fetching' || status === 'resolving') ? 'Resolving…' : 'Queued…'; cell.appendChild(p);
            }

            row.append(badge, cell, st, cpBtn);
            return { row, cell, st, cpBtn };
        }

        function updateRow(row, cell, st, cpBtn, status, link, errMsg) {
            row.className = 'ri ' + status;
            st.className = 'ri-status ' + status; st.textContent = statusLabel(status);
            cell.innerHTML = '';
            if (link) {
                const a = document.createElement('a');
                a.className = 'ri-link'; a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
                a.textContent = link; cell.appendChild(a);
                cpBtn.style.display = ''; cpBtn.className = 'btn-copy-one'; cpBtn.textContent = 'Copy';
                cpBtn.onclick = () => copyOne(link, cpBtn);
            } else if (errMsg) {
                const e = document.createElement('span'); e.className = 'ri-err'; e.textContent = errMsg; cell.appendChild(e);
                cpBtn.style.display = 'none';
            } else {
                const p = document.createElement('span'); p.className = 'ri-ph';
                p.textContent = (status === 'fetching' || status === 'resolving') ? 'Resolving…' : 'Queued…'; cell.appendChild(p);
                cpBtn.style.display = 'none';
            }
        }

        // ── STATE ──
        let fetchES = null, isFetching = false;
        let fetchLinks = [], fetchMap = {}, fetchTotal = 0;
        let fetchRetryCount = 0;
        const MAX_FETCH_RETRIES = 3;

        function startFetching() {
            if (isFetching) return;
            const urls = document.getElementById('urlInput').value.trim().split('\n').map(u => u.trim()).filter(Boolean).slice(0, 10);
            if (!urls.length) { showToast('Paste at least one URL'); return; }

            resetFetchResults(); isFetching = true;
            fetchRetryCount = 0;
            setBtn(true, 'Fetching…');
            showSB(); setSBText('Connecting…');
            document.getElementById('fetchResultsWrap').style.display = 'block';

            connectFetch(urls);
        }

        function connectFetch(urls) {
            if (fetchES) { fetchES.close(); fetchES = null; }
            fetchES = new EventSource(API_BASE + '/api/fetch?urls=' + encodeURIComponent(urls.join(',')));

            let connected = false;
            let errorCount = 0;

            fetchES.onopen = () => {
                console.log('[SSE] Connection opened');
            };

            fetchES.onmessage = e => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'connected') {
                        connected = true;
                        setSBText('Connected — scanning…');
                    }
                    handleEvent(data);
                } catch (err) {
                    console.error('[SSE] Parse error:', err);
                }
            };

            fetchES.onerror = () => {
                errorCount++;
                console.log('[SSE] Error event #' + errorCount + ', connected=' + connected + ', readyState=' + fetchES.readyState);

                if (fetchES.readyState === EventSource.CLOSED) {
                    // Connection was closed permanently
                    if (connected) {
                        // Was connected but lost — likely done or server ended it
                        if (isFetching) {
                            setSBText('Connection closed by server');
                            stopFetch();
                        }
                    } else {
                        // Never connected — retry
                        if (fetchRetryCount < MAX_FETCH_RETRIES) {
                            fetchRetryCount++;
                            setSBText('Connection failed, retrying (' + fetchRetryCount + '/' + MAX_FETCH_RETRIES + ')…');
                            console.log('[SSE] Retrying in 2s…');
                            setTimeout(() => { if (isFetching) connectFetch(urls); }, 2000);
                        } else {
                            setSBText('Connection failed after ' + MAX_FETCH_RETRIES + ' retries');
                            stopFetch();
                        }
                    }
                }
                // readyState === CONNECTING means EventSource is auto-reconnecting — do nothing
            };
        }

        function handleEvent(d) {
            if (d.type === 'connected') { setSBText('Connected — scanning…'); return; }
            if (d.type === 'status') { setSBText(d.message); }
            if (d.type === 'warning') { showToast('⚠ ' + d.message); }
            if (d.type === 'episodes_found') {
                fetchTotal = d.count;
                document.querySelector('#fetchBox .empty-state')?.remove();
                d.episodes.forEach(ep => addRow(ep, 'waiting', null, null));
                setProg(0, fetchTotal);
                setSBText('Found ' + fetchTotal + ' episode' + (fetchTotal > 1 ? 's' : '') + '. Extracting links…');
            }
            if (d.type === 'progress') {
                const r = fetchMap[d.episode];
                if (r) updateRow(r.row, r.cell, r.st, r.cpBtn, 'fetching', null, null);
                else addRow(d.episode, 'fetching', null, null);
            }
            if (d.type === 'result') {
                setProg(d.processed, d.total);
                setSBText('Processing ' + d.processed + ' of ' + d.total + '…');
                if (d.status === 'done') {
                    const r = fetchMap[d.episode];
                    if (r) updateRow(r.row, r.cell, r.st, r.cpBtn, 'done', d.link, null);
                    else addRow(d.episode, 'done', d.link, null);
                    fetchLinks.push(d.link);
                    document.getElementById('fetchCopyAll').disabled = false;
                } else {
                    const r = fetchMap[d.episode];
                    if (r) updateRow(r.row, r.cell, r.st, r.cpBtn, 'failed', null, d.error);
                    else addRow(d.episode, 'failed', null, d.error);
                }
            }
            if (d.type === 'done') {
                setSBText('Done — ' + fetchLinks.length + ' link' + (fetchLinks.length !== 1 ? 's' : '') + ' extracted');
                setProg(fetchTotal, fetchTotal);
                stopFetch();
            }
            if (d.type === 'error') { setSBText('❌ ' + d.message); stopFetch(); }
        }

        function addRow(ep, status, link, err) {
            const box = document.getElementById('fetchBox');
            if (fetchMap[ep]) { updateRow(fetchMap[ep].row, fetchMap[ep].cell, fetchMap[ep].st, fetchMap[ep].cpBtn, status, link, err); return; }
            const r = buildRow(ep, status, link, err);
            box.appendChild(r.row); fetchMap[ep] = r;
            r.row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function stopFetch() {
            isFetching = false;
            setBtn(false, 'Start Fetching');
            if (fetchES) { fetchES.close(); fetchES = null; }
        }

        function clearFetch() {
            stopFetch();
            fetch(API_BASE + '/api/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => { });
            document.getElementById('urlInput').value = '';
            resetFetchResults();
            document.getElementById('fetchResultsWrap').style.display = 'none';
            hideSB();
            showToast('Cleared');
        }

        function resetFetchResults() {
            fetchLinks = []; fetchMap = {}; fetchTotal = 0;
            document.getElementById('fetchBox').innerHTML = '<div class="empty-state">Waiting for results…</div>';
            document.getElementById('fetchCopyAll').disabled = true;
            setProg(0, 1);
        }

        function copyAll() {
            if (!fetchLinks.length) return;
            navigator.clipboard.writeText(fetchLinks.join('\n')).then(() => {
                showToast('✓ Copied ' + fetchLinks.length + ' link' + (fetchLinks.length > 1 ? 's' : ''));
            }).catch(() => showToast('Copy failed'));
        }

        // ── UI HELPERS ──
        function setBtn(disabled, label) {
            const btn = document.getElementById('fetchBtn');
            btn.disabled = disabled;
            if (disabled) btn.classList.add('fetching'); else btn.classList.remove('fetching');
            document.getElementById('fetchBtnText').textContent = label;
        }

        function showSB() { document.getElementById('fetchSB').classList.add('visible'); }
        function hideSB() { document.getElementById('fetchSB').classList.remove('visible'); }
        function setSBText(msg) { document.getElementById('fetchStatus').textContent = msg; }
        function setProg(done, total) {
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('fetchProg').style.width = pct + '%';
        }
    </script>

</body>

</html>
